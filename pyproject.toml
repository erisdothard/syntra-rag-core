[project]
name = "syntra-rag-core"
version = "0.1.0"
description = "Reusable, industry-neutral RAG pipeline. One core, many clients."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "supabase>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["core*", "clients*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
