name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e . && pip install pytest pytest-asyncio pytest-cov
      - run: python -m pytest tests/ -v --cov=core --cov=clients --cov-report=term-missing --tb=short

  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core neutrality check
        run: |
          if grep -ri "loinc\|snomed\|fhir\|hl7\|observation" core/; then
            echo "FAIL: Domain terms found in core/"
            exit 1
          fi
          echo "PASS: core/ is domain-neutral"
